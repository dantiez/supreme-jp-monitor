name: Supreme JP stock scan

# Manual only. Scanning is normally triggered from the dashboard button; this
# workflow exists for running a scan when the dashboard is not up.
#
# NO SCHEDULE. The customer asked for scanning to happen on a button in the
# dashboard rather than automatically, so the cron triggers are removed rather
# than left commented out where they would look active.
#
# What that costs, recorded here because it is not obvious from the code: while
# nobody clicks, nothing is watched. A size that returns at 03:00 and sells out
# by 05:00 is never seen and never enters the history, because no scan ran
# between those two moments. Restoring automatic cover means putting the
# `schedule:` block back.
#
# Manual dispatch stays: it is useful for running a scan without the dashboard
# up, and it costs nothing while unused.
on:
  workflow_dispatch:
    inputs:
      max_products:
        description: 'Cap products checked (blank = no cap)'
        required: false
      notify:
        description: 'Send the Discord alert'
        type: boolean
        default: true

concurrency:
  # Two overlapping scans would compare against a half-written "before" and
  # report changes that are really just the other run's writes.
  group: supreme-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Decide scan arguments
        id: args
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MAX: ${{ inputs.max_products }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          # Worked out in shell rather than a chained GitHub expression. The
          # expression form read as `a && b || c || d` and silently produced
          # --max=400 for a manual run with a blank cap, which is the opposite
          # of what the input promises. Shell makes each branch visible.
          ARGS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Blank input means no cap, exactly as the field says.
            [ -n "$MAX" ] && ARGS="--max=$MAX"
            [ "$NOTIFY" = "false" ] && ARGS="$ARGS --no-notify"
          elif [ "$SCHEDULE" = "0 22 * * *" ]; then
            # Daily full sweep: uncapped, catches new products.
            ARGS=""
          else
            # Two-hourly stock check: capped so it finishes inside the window.
            ARGS="--max=400"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"
          echo "scan args: ${ARGS:-(none)}"

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run scan -- ${{ steps.args.outputs.value }}
