name: Supreme JP stock scan

# The scheduler lives here rather than in the Render service on purpose: a free
# Render instance sleeps after 15 minutes of no traffic, and a sleeping instance
# runs no cron. Actions fires regardless of whether anything else is awake.
#
# Two cadences, matching the requirement's split between discovery and stock:
#   - stock check every 2 hours, capped, to catch restocks
#   - full sweep once a day, uncapped, to catch new products
#
# Times are UTC. Supreme JP drops on Thursday mornings JST (Wednesday ~23:00
# UTC), which the 2-hourly cadence already covers.

on:
  schedule:
    # Stock check: every 2 hours.
    - cron: '0 */2 * * *'
    # Full sweep: 22:00 UTC daily (07:00 JST, before the shop opens).
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: 'Cap products checked (blank = no cap)'
        required: false
      notify:
        description: 'Send the Discord alert'
        type: boolean
        default: true

concurrency:
  # Two overlapping scans would compare against a half-written "before" and
  # report changes that are really just the other run's writes.
  group: supreme-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Decide scan arguments
        id: args
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MAX: ${{ inputs.max_products }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          # Worked out in shell rather than a chained GitHub expression. The
          # expression form read as `a && b || c || d` and silently produced
          # --max=400 for a manual run with a blank cap, which is the opposite
          # of what the input promises. Shell makes each branch visible.
          ARGS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Blank input means no cap, exactly as the field says.
            [ -n "$MAX" ] && ARGS="--max=$MAX"
            [ "$NOTIFY" = "false" ] && ARGS="$ARGS --no-notify"
          elif [ "$SCHEDULE" = "0 22 * * *" ]; then
            # Daily full sweep: uncapped, catches new products.
            ARGS=""
          else
            # Two-hourly stock check: capped so it finishes inside the window.
            ARGS="--max=400"
          fi
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"
          echo "scan args: ${ARGS:-(none)}"

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run scan -- ${{ steps.args.outputs.value }}
